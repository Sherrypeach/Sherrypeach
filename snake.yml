name: Generate contribution snake

on:
  schedule:
    - cron: "0 3 * * *"   # once a day (00:00 Buenos Aires)
  workflow_dispatch:       # lets you run it manually from the Actions tab
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#A8878F&color_dots=#f0eef0,#f4e6ea,#e2c4cc,#c9a0aa,#A8878F
            dist/github-snake-dark.svg?color_snake=#f4e6ea&color_dots=#161b22,#3a2a2f,#5a4148,#8a6a72,#c9a9b1

      - name: Push SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
